# Lint, type-check, build, and run the CI-safe Playwright project.
#
# The Playwright suite is split into three projects in playwright.config.ts,
# by tags in the test title:
#   - CI (this workflow): specs NOT tagged @live — unit-style tests plus specs
#     that spawn their own throwaway next servers. No OpenClaw gateway, no
#     shared app, no browser. Equivalent to `--grep-invert @live`.
#   - LIVE_GATEWAY: specs tagged @live (but not @ui). Need a real gateway on
#     127.0.0.1:18789 and Mission Control on :3100. Still request-style, so
#     still no browser. Run locally: `npm run test:gateway`.
#   - LIVE_UI: specs tagged @ui. The only tests that drive a browser, so the
#     only ones needing `npm run test:install`. Run locally: `npm run test:ui`.
#
# Neither live project can run here — GitHub Actions has no OpenClaw gateway
# and no Mission Control instance — so this job deliberately installs no
# browsers, which is also what keeps its runtime short.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # `npm test` is exactly this command; spelled out so a failure names the
      # project that failed.
      - name: Playwright (CI project — skips @live and @ui specs)
        run: npx playwright test --project=CI

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
