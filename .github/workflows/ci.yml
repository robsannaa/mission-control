# Lint, type-check, build, and run the two blocking-here lanes: the Vitest
# fast lane and the CI-safe Playwright project.
#
# There are two test runners and five lanes total. This job runs two of them:
#   - Vitest fast lane (the `test:unit` script, this workflow): the `unit`
#     and `component` Vitest projects. No OpenClaw gateway, no shared app, no
#     browser. Sub-15-second feedback on pure logic.
#   - Playwright CI project (this workflow): specs NOT tagged @live —
#     unit-style tests plus specs that spawn their own throwaway next
#     servers. No OpenClaw gateway, no shared app, no browser. Equivalent to
#     `--grep-invert @live`.
#
# The other three lanes deliberately do NOT run here, because GitHub Actions
# has no OpenClaw gateway, no Mission Control instance and no G-Brain:
#   - Vitest live project (`npm run test:integration`) — in-process route
#     tests against the real dev gateway.
#   - Playwright LIVE_GATEWAY (`npm run test:gateway`) — request-style specs
#     tagged @live (but not @ui), hitting the real gateway and Mission
#     Control on :3100. Still no browser.
#   - Playwright LIVE_UI (`npm run test:ui`) — specs tagged @ui, the only
#     ones driving a real browser, so the only ones needing
#     `npm run test:install`.
#
# Those three instance-dependent lanes are covered instead by a local
# pre-merge gate: run `npm run test:premerge` against the dev instance before
# opening a pull request. See docs/TESTING.md for the full lane table and the
# blocking-status rule. This job deliberately installs no browsers, which is
# also what keeps its runtime short.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Vitest fast lane (unit and component projects)
        run: npm run test:unit

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # `npm test` is exactly this command; spelled out so a failure names the
      # project that failed.
      - name: Playwright (CI project — skips @live and @ui specs)
        run: npx playwright test --project=CI

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
